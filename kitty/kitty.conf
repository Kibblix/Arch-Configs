font_family JetBrainsMono Nerd Font
font_size 12.0

window_padding_width 12
window_margin_width 4

hide_window_decorations yes
dynamic_background_opacity no
background_opacity 0.9

remember_window_size yes
confirm_os_window_close 0

cursor #DCDCD7
cursor_shape block
cursor_blink_interval 0.1
cursor_stop_blinking_after 0

scrollback_lines 100000
repaint_delay 8
input_delay 2
sync_to_monitor yes

shell_integration enabled

foreground #DCDCD7
background #232323

color0  #232323
color1  #CD233A
color2  #86EFAC
color3  #FFD166
color4  #CD233A
color5  #FF6F91
color6  #FF8FAB
color7  #DCDCD7

color8  #4B4B4B
color9  #FF6F91
color10 #BBF7D0
color11 #FFE08A
color12 #FF8FAB
color13 #F5A9B8
color14 #FFC2D1
color15 #FFFFFF

selection_background #232323
selection_foreground #CD233A

url_color #FF6F91
url_style curly

tab_bar_edge top
tab_separator " ┇ "

active_tab_foreground #DCDCD7
active_tab_background #CD233A

inactive_tab_foreground #DCDCD7
inactive_tab_background #4B4B4B

active_tab_font_style bold
inactive_tab_font_style normal

active_border_color #CD233A
inactive_border_color #4B4B4B

enable_audio_bell no
visual_bell_duration 0.2
bell_border_color #FF6F91

copy_on_select yes

symbol_map U+E000-U+F8FF JetBrainsMono Nerd Font

disable_ligatures never
